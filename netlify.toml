# netlify.toml

[build]
  command = "npm install"
  publish = "." 
  functions = "api" 

[functions]
  # This line is important for ensuring modern Node.js features work correctly
  # and sometimes helps with compatibility for Response objects.
  node_bundler = "esbuild"
  # You can also set a timeout here if you suspect long database operations (e.g., timeout = 30)

[[redirects]]
  from = "/lesson"
  to = "/lesson.html"
  status = 200

[[redirects]]
  from = "/developer"
  to = "/developer.html"
  status = 200

[[redirects]]
  from = "/study"
  to = "/study.html"
  status = 200